
# Development stack.
#
# Core services (postgres, redis, minio, itsm-init, itsm-backend, itsm-frontend)
# start with a plain `docker compose -f docker-compose.dev.yml up -d` — no
# --profile flag required.
#
# Optional components stay behind profiles:
#   --profile ai          adds Ollama (local LLM)
#   --profile monitoring  adds Prometheus + Grafana
#
# The `dev` profile is still accepted for backwards compatibility but is no
# longer needed. Previously every core service carried `profiles: ["dev"]`,
# which made the intuitive command silently start nothing at all and report
# success — please do not reintroduce it on the core services.

services:
  # PostgreSQL 数据库（开发环境）
  # 本机 Homebrew PostgreSQL 默认占用 5432，开发容器改为发布到 55432。
  # 后端使用 `postgres:5432`（容器网络主机名），因此 8090/3000 等对外端口不受影响。
  # 集成测试可通过 `host=localhost port=55432` 直接连接容器内的真实 PG。
  postgres:
    image: pgvector/pgvector:pg17
    container_name: itsm-postgres-dev
    hostname: postgres
    environment:
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: dev123
    ports:
      - "55432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - itsm-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U itsm_user -d itsm" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  # Redis 缓存（开发环境）
  redis:
    image: redis:7-alpine
    container_name: itsm-redis-dev
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - itsm-dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  # MinIO 对象存储（开发环境，可选）
  minio:
    image: minio/minio:latest
    container_name: itsm-minio-dev
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_dev_data:/data
    networks:
      - itsm-dev-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # ITSM 后端服务（开发环境）
  itsm-init:
    build:
      context: ./itsm-backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - http_proxy=
        - https_proxy=
    container_name: itsm-init-dev
    hostname: init
    command: ["./main"]
    environment:
      - DATABASE_URL=postgres://itsm_user:dev123@postgres:5432/itsm?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=itsm_user
      - DB_PASSWORD=dev123
      - DB_NAME=itsm
      - DB_SSLMODE=disable
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - JWT_SECRET=dev-secret-key-change-in-production-minimum-32-characters-long
      - LOG_LEVEL=debug
      # 显式声明开发环境：避免 DEPLOYMENT_MODE=private 被默认判定为生产环境，触发 DEFAULT_JWT_SECRET fail-closed
      - ENV=development
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-private}
      - ADMIN_PASSWORD=admin123
      - ITSM_BOOTSTRAP_ONLY=true
      - ITSM_AUTO_MIGRATE=true
      - ITSM_AUTO_SEED=true
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm-dev-network
    restart: "no"
  # ITSM 后端服务（开发环境）
  itsm-backend:
    build:
      context: ./itsm-backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - http_proxy=
        - https_proxy=
    container_name: itsm-backend-dev
    hostname: backend
    environment:
      # 数据库配置
      - DATABASE_URL=postgres://itsm_user:dev123@postgres:5432/itsm?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=itsm_user
      - DB_PASSWORD=dev123
      - DB_NAME=itsm
      - DB_SSLMODE=disable

      # Redis 配置
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0

      # 服务配置
      - GIN_MODE=debug
      - SERVER_ENV=development
      # 显式声明开发环境（凭据守卫优先读 ENV），避免 dev JWT 触发 fail-closed
      - ENV=development
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-private}
      - ADMIN_PASSWORD=admin123
      # schema 迁移由独立 itsm-init 容器（ITSM_BOOTSTRAP_ONLY=true）完成；
      # web 进程禁止 AUTO_MIGRATE/AUTO_SEED（ValidateWebStartupConfig fail-closed）
      - ITSM_AUTO_MIGRATE=false
      - ITSM_AUTO_SEED=false

      # JWT 配置
      - JWT_SECRET=dev-secret-key-change-in-production-minimum-32-characters-long
      - JWT_EXPIRE_TIME=900
      - JWT_REFRESH_EXPIRE_TIME=604800

      # 日志配置
      - LOG_LEVEL=debug
      - LOG_PATH=/app/logs

      # 对象存储
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_BUCKET=itsm-uploads

      # LLM 配置（开发用本地模型）
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 # 指向宿主机（开发用）
      # 或者使用本地运行的 Ollama 容器:
      # - OLLAMA_BASE_URL=http://ollama:11434

      # 其他
      - ENABLE_SWAGGER=true
      - ENABLE_CORS=true
      # CORS 白名单：开发环境允许前端 3000 以及常用调试端口；避免 TRAE 代理导致的 ERR_FAILED
      - ITSM_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000
      # GIN_MODE=debug -> gin.Mode() != release -> default echo reqOrigin; kept as defense in depth
      - GIN_MODE=debug

      # 清除代理（避免 Docker Desktop 代理干扰容器内请求）
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      itsm-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - itsm-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget --no-verbose --tries=1 --spider http://localhost:8090/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # ITSM 前端服务（开发环境）
  itsm-frontend:
    build:
      context: ./itsm-frontend
      dockerfile: Dockerfile
      target: runner
      args:
        - NODE_ENV=development
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - http_proxy=
        - https_proxy=
    container_name: itsm-frontend-dev
    hostname: frontend
    environment:
      - NODE_ENV=development
      - ITSM_BACKEND_URL=http://backend:8090
      # 使用同源代理模式：浏览器请求 /api/v1/... 通过 Next.js 代理路由转发到后端
      # 这样避免了跨域 cookie (SameSite=Lax) 和 CORS 预检问题
      # - NEXT_PUBLIC_API_URL=http://localhost:8090
      - NEXT_PUBLIC_ENABLE_AI=true
      - NEXT_PUBLIC_ENABLE_SWAGGER=true

      # 清除代理
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=
      - no_proxy=
    ports:
      - "3000:3000"
      - "9229:9229" # Node.js debug 端口
    depends_on:
      itsm-backend:
        condition: service_healthy
    networks:
      - itsm-dev-network
    volumes:
      - ./itsm-frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
  # Ollama（本地 LLM 服务，可选）
  ollama:
    image: ollama/ollama:latest
    container_name: itsm-ollama-dev
    hostname: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_dev_data:/root/.ollama
    networks:
      - itsm-dev-network
    restart: unless-stopped
    profiles: [ "ai" ]
    # 首次启动后需要拉取模型:
    # docker exec itsm-ollama-dev ollama pull llama2

    # Prometheus（监控，可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: itsm-prometheus-dev
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_dev_data:/prometheus
    networks:
      - itsm-dev-network
    restart: unless-stopped
    profiles: [ "monitoring" ]

  # Grafana（监控面板，可选）
  grafana:
    # Pinned to the same version as monitoring/docker-compose.monitoring.yml —
    # "latest" made the two stacks drift apart.
    image: grafana/grafana:10.1.0
    container_name: itsm-grafana-dev
    hostname: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - grafana_dev_data:/var/lib/grafana
      # provisioning/ = provider + datasource configs
      # dashboards/   = dashboard JSONs, loaded via provider.yml `options.path`
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - itsm-dev-network
    restart: unless-stopped
    profiles: [ "monitoring" ]

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  minio_dev_data:
    driver: local
  ollama_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local

networks:
  itsm-dev-network:
    driver: bridge
