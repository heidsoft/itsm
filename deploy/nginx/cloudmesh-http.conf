# ================================================================
#  CloudMesh Official Website — Nginx Production Config
#  Deploy path: site root served at /
#  Usage: include this in your main nginx.conf or sites-enabled/
#
#  sudo cp nginx.conf /etc/nginx/sites-available/cloudmesh
#  sudo ln -sf /etc/nginx/sites-available/cloudmesh /etc/nginx/sites-enabled/
#  sudo nginx -t && sudo systemctl reload nginx
# ================================================================

server {
    listen 80;
    server_name cloudmesh.top www.cloudmesh.top;   # ← 改为你的域名

    # Redirect HTTP → HTTPS (uncomment after SSL cert is ready)
    # return 301 https://$server_name$request_uri;

    root /var/www/cloudmesh;                      # ← 改为你的实际部署路径
    index index.html;

    # ── Security Headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # ── ACME HTTP-01 challenge path (keep open for renewal) ──
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cloudmesh;
        allow all;
        try_files $uri =404;
    }

    # ── Deny sensitive paths ──
    location ~ /\.(?!well-known) { deny all; }          # dotfiles (.git, .env etc.)
    location ~ ^/(archive|memory|\.git|node_modules)(/|$) { deny all; }
    # Backend / server / data / internal dirs — never served as static site
    location ~ ^/(feishu-server|cron|scripts|geo-diagnostic|openclaw-deploy|openclaw-generator|openclaw-spec|itsm-desktop|itsm-frontend|itsm-mobile|product|sales|seo|content|geo-monitor|geo-service|wechat-publisher|wechat-articles)(/|$) { deny all; }
    location = /openclaw-workspace-state.json { deny all; }
    # ── Block executable / source / backup files (2026-11-15 hardening) ──
    # Must precede the static-asset regex below (first-match-wins for regex).
    # Keeps .md/.html/.json/.css/.js/.png assets intact.
    location ~* \.(sh|bash|zsh|py|pyc|pyo|bat|cmd|exe|so|dll|bak|old|orig|save|swp|tmp|zip|tar|gz|tgz|bz2|7z|rar|sql|sqlite|db|pem|key|p12|pfx|crt|cer|der|log|env|example|mjs|ts|template)$ { deny all; }
    location = /deploy.sh { deny all; }

    # ── Static Asset Caching ──
    # No fingerprinted URLs yet: `immutable` would pin stale CSS for 30 days.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate" always;
        access_log off;
    }

    # ── Docs & Blog HTML: no cache for content updates ──
    #    NOTE: must come BEFORE the generic \.html$ block —
    #    nginx regex locations match in file order (first match wins).
    location ~* ^/(docs|blog)/.*\.html$ {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── HTML: revalidate on every request (re-deploy visible immediately) ──
    # `expires 1h` emitted a second, conflicting Cache-Control header.
    location ~* \.html$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ── Favicon & robots/sitemap ──
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt { log_not_found off; access_log off; }
    location = /sitemap.xml { log_not_found off; access_log off; }

    # ── Login redirect (top-level login.html) ──
    location = /login.html { return 301 /deploy/login.html; }


    # ── Custom 404 ──
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    # ── Access Log ──
    access_log /var/log/nginx/cloudmesh_access.log;
    error_log  /var/log/nginx/cloudmesh_error.log warn;
}

