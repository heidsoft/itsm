server {
    listen 443 ssl http2;
    server_name cloudmesh.top www.cloudmesh.top;

    ssl_certificate /etc/letsencrypt/live/cloudmesh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudmesh.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS intentionally disabled: certificate is valid until 2027-02-12,
    # but automated renewal is not in place yet. Enable after that is closed.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/cloudmesh;
    index index.html;

    # Content freshness for the static site (2026-11-14).
    # Server-level header is safe: /h5/ has its own stricter location-level
    # add_header, which overrides this one; no regex locations are added here.
    add_header Cache-Control "no-cache, must-revalidate" always;

    # Shared security headers / gzip / deny policy (2026-11-14)
    include /etc/nginx/snippets/cloudmesh-common.conf;

    access_log /var/log/nginx/cloudmesh_ssl_access.log;
    error_log  /var/log/nginx/cloudmesh_ssl_error.log warn;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # H5 demo: no caching, Feishu WebView otherwise loops on stale content
    location /h5/ {
        alias /usr/share/nginx/html/h5/;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
    }
}
