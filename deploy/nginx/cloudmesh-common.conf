# ==================================================================
# Shared security / gzip / deny policy for cloudmesh.top
# Included INSIDE the :443 server block (2026-11-14).
# The :80 server keeps its own historical rules untouched.
# NOTE: no generic regex locations here on purpose — the :443 server
#       serves /clawops/ and /h5/ from aliases and /api/ from proxies.
#       A `\.html$` or `\.(css|js)$` regex would shadow those aliases.
#       :443 sets a server-level revalidation header for HTML; :80 keeps
#       its own asset cache rules until both blocks are unified.
# NOTE: HSTS is intentionally NOT enabled. The certificate is valid until
#       2027-02-12; enable HSTS only after automated renewal is in place.
# ==================================================================

# ── Security headers ──
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ── Gzip ──
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml+rss
    image/svg+xml;

# ── ACME HTTP-01 challenge path (kept open for future renewal) ──
location ^~ /.well-known/acme-challenge/ {
    root /var/www/cloudmesh;
    allow all;
    try_files $uri =404;
}

# ── Deny sensitive paths (must precede any other regex location) ──
# NOTE: the (/|$) boundary is required. Without it, `product` would also
#       match `/products/itsm.html` and deny the product pages.
location ~ /\.(?!well-known) { deny all; }
location ~ ^/(archive|memory|\.git|node_modules)(/|$) { deny all; }
location ~ ^/(feishu-server|cron|scripts|geo-diagnostic|openclaw-deploy|openclaw-generator|openclaw-spec|itsm-desktop|itsm-frontend|itsm-mobile|product|sales|seo|content|geo-monitor|geo-service|wechat-publisher|wechat-articles)(/|$) { deny all; }
location = /openclaw-workspace-state.json { deny all; }
# ── Block executable / source / backup files anywhere (2026-11-15 hardening) ──
# These extensions have no business being served as public web content. Must
# stay BEFORE any generic static-asset regex (first-match-wins for regex locs).
# Keeps .md (skill docs), .html, .json (metadata), .css/.js assets intact.
location ~* \.(sh|bash|zsh|py|pyc|pyo|bat|cmd|exe|so|dll|bak|old|orig|save|swp|tmp|zip|tar|gz|tgz|bz2|7z|rar|sql|sqlite|db|pem|key|p12|pfx|crt|cer|der|log|env|example|mjs|ts|template)$ { deny all; }
# Explicit internal-only files that lack a dangerous extension
location = /deploy.sh { deny all; }
location = /blog/index.html.bak { deny all; }

# ── Machine-readable / crawl entry points (exact matches only) ──
location = /favicon.ico { log_not_found off; access_log off; }
location = /robots.txt { log_not_found off; access_log off; }
location = /sitemap.xml { log_not_found off; access_log off; }
location = /llms.txt { log_not_found off; access_log off; }
location = /llms-full.txt { log_not_found off; access_log off; }
location = /login.html { return 301 /deploy/login.html; }

# ── Custom error pages ──
error_page 404 /404.html;
error_page 500 502 503 504 /50x.html;
