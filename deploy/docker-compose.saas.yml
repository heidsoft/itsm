# =============================================================================
# ITSM — SaaS 单实例多租户部署（阿里云 ECS 等单主机场景）
# -----------------------------------------------------------------------------
# 与 docker-compose.prod.yml 的关系：
#   - 复用同一套服务定义（postgres / redis / init / backend / ai-service /
#     worker / frontend），但把边缘反向代理从「仅 80、依赖外部 TLS 终止」换成
#     「Caddy 自动 Let's Encrypt 证书」，使单机可直接对外提供 HTTPS。
#   - DEPLOYMENT_MODE 固定为 saas，声明这是单实例多租户交付形态。
#   - 镜像支持从阿里云 ACR（REGISTRY 前缀）拉取，便于镜像市场上架后分发。
#
# 启动：
#   docker compose --env-file deploy/.env.saas -f deploy/docker-compose.saas.yml up -d
#
# 说明：
#   - 本文件不绑定具体密码/域名，全部来自 deploy/.env.saas。
#   - 数据卷用命名卷（非 external），项目名固定为 itsm-saas，避免卷名漂移。
#   - 默认不开通 monitoring / storage profile，按需 --profile 启用。
# =============================================================================
name: itsm-saas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # PostgreSQL 数据库（SaaS 单实例）
  postgres:
    image: pgvector/pgvector:pg17
    container_name: itsm-saas-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-itsm_prod}
      POSTGRES_USER: ${DB_USER:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - itsm_saas_postgres_data:/var/lib/postgresql/data
      - ./data/backups:/backups:ro
    networks:
      - itsm-saas-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-itsm} -d ${DB_NAME:-itsm_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    logging: *default-logging
    mem_limit: "2g"
    cpus: "2.0"

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: itsm-saas-redis
    hostname: redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
      --save 60 10000 --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - itsm_saas_redis_data:/data
    networks:
      - itsm-saas-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
          "ping",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    logging: *default-logging
    mem_limit: "2560m"
    cpus: "1.0"

  # 初始化容器：自动迁移 + 种子（建 admin 账户）。一次性运行（restart: "no"）。
  itsm-init:
    image: ${REGISTRY:-}itsm-backend:${VERSION:?VERSION must be set}
    container_name: itsm-saas-init
    hostname: init
    command: ["./main"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - LOG_LEVEL=error
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set - without it no admin account is created and you cannot sign in}
      - ITSM_BOOTSTRAP_ONLY=true
      - ITSM_AUTO_MIGRATE=true
      - ITSM_AUTO_SEED=true
      - BOOTSTRAP_TOKEN_ENABLED=${BOOTSTRAP_TOKEN_ENABLED:-0}
      - RLS_MODE=off
      - RLS_TENANT_VAR_NAME=app.current_tenant
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-saas-network
    restart: "no"
    logging: *default-logging
    mem_limit: "512m"
    cpus: "2.0"

  # ITSM 后端服务
  itsm-backend:
    image: ${REGISTRY:-}itsm-backend:${VERSION:?VERSION must be set}
    container_name: itsm-saas-backend
    hostname: backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - SERVER_ENV=production
      - SERVER_HOST=0.0.0.0
      - APP_VERSION=${VERSION:?VERSION must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - BOOTSTRAP_TOKEN_ENABLED=${BOOTSTRAP_TOKEN_ENABLED:-1}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRE_TIME=86400
      - JWT_REFRESH_EXPIRE_TIME=604800
      - LOG_LEVEL=error
      - LOG_PATH=/app/logs
      - LOG_FORMAT=json
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - ITSM_AUTO_MIGRATE=false
      - ITSM_AUTO_SEED=false
      - ITSM_PROCESS_MODE=api
      - RLS_MODE=${RLS_MODE:-off}
      - RLS_TENANT_VAR_NAME=${RLS_TENANT_VAR_NAME:-app.current_tenant}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-itsm-uploads}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - METRICS_REQUIRE_AUTH=${METRICS_REQUIRE_AUTH:-true}
      - CONNECTOR_CONFIG_ENCRYPTION_KEY=${CONNECTOR_CONFIG_ENCRYPTION_KEY:?CONNECTOR_CONFIG_ENCRYPTION_KEY must be set in production}
      - ITSM_ALIYUN_ACCESS_KEY_ID=${ITSM_ALIYUN_ACCESS_KEY_ID:-}
      - ITSM_ALIYUN_ACCESS_KEY_SECRET=${ITSM_ALIYUN_ACCESS_KEY_SECRET:-}
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - ITSM_AI_READY=${ITSM_AI_READY:-}
      - ITSM_CMDB_DISCOVERY_READY=${ITSM_CMDB_DISCOVERY_READY:-}
      - ITSM_FEISHU_READY=${ITSM_FEISHU_READY:-}
      - ITSM_WECOM_READY=${ITSM_WECOM_READY:-}
      - ITSM_DINGTALK_READY=${ITSM_DINGTALK_READY:-}
      - GUIDANCE_URL=${GUIDANCE_URL:-http://itsm-ai-service:8000}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@${SAAS_DOMAIN:-yourdomain.com}}
      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
      - ENABLE_CORS=true
      - ITSM_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${SAAS_DOMAIN:-yourdomain.com}}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      itsm-init:
        condition: service_completed_successfully
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-saas-network
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget --no-verbose --tries=1 --spider http://localhost:8090/api/v1/readyz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    logging: *default-logging
    mem_limit: "1g"
    cpus: "2.0"

  # Guidance sidecar（受限 JSON 生成）
  itsm-ai-service:
    image: ${REGISTRY:-}itsm-ai-service:${VERSION:?VERSION must be set}
    container_name: itsm-saas-ai-service
    hostname: ai-service
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - LOG_LEVEL=${AI_LOG_LEVEL:-info}
      - CORS_ORIGINS=http://itsm-frontend:3000,http://caddy
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_ENDPOINT:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      - LLM_TIMEOUT=120
      - ITSM_BACKEND_URL=${ITSM_BACKEND_URL:-http://itsm-backend:8090}
      - ITSM_BACKEND_TOKEN=${ITSM_BACKEND_TOKEN:-}
      - BACKEND_TIMEOUT=${BACKEND_TIMEOUT:-120}
    expose:
      - "8000"
    networks:
      - itsm-saas-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging: *default-logging
    mem_limit: "1g"
    cpus: "2.0"

  # 调度器（命令/SLA/升级/索引）
  itsm-worker:
    image: ${REGISTRY:-}itsm-backend:${VERSION:?VERSION must be set}
    container_name: itsm-saas-worker
    hostname: worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - SERVER_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - LOG_LEVEL=error
      - LOG_PATH=/app/logs
      - LOG_FORMAT=json
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-saas}
      - ITSM_AUTO_MIGRATE=false
      - ITSM_AUTO_SEED=false
      - ITSM_PROCESS_MODE=worker
      - RLS_MODE=${RLS_MODE:-off}
      - RLS_TENANT_VAR_NAME=${RLS_TENANT_VAR_NAME:-app.current_tenant}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-itsm-uploads}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - CONNECTOR_CONFIG_ENCRYPTION_KEY=${CONNECTOR_CONFIG_ENCRYPTION_KEY:?CONNECTOR_CONFIG_ENCRYPTION_KEY must be set in production}
      - ITSM_ALIYUN_ACCESS_KEY_ID=${ITSM_ALIYUN_ACCESS_KEY_ID:-}
      - ITSM_ALIYUN_ACCESS_KEY_SECRET=${ITSM_ALIYUN_ACCESS_KEY_SECRET:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      itsm-init:
        condition: service_completed_successfully
    volumes:
      - ./data/logs:/app/logs
      - ./data/uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-saas-network
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 35s
    restart: always
    logging: *default-logging
    mem_limit: "512m"
    cpus: "1.0"

  # ITSM 前端服务
  itsm-frontend:
    image: ${REGISTRY:-}itsm-frontend:${VERSION:?VERSION must be set}
    container_name: itsm-saas-frontend
    hostname: frontend
    environment:
      - NODE_ENV=production
      - ITSM_BACKEND_URL=http://itsm-backend:8090
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    # NEXT_PUBLIC_API_URL 留空：浏览器走同源 /api 经 Caddy 反代（见 Caddyfile）。
    expose:
      - "3000"
    volumes:
      - ./data/uploads:/app/public/uploads:ro
    networks:
      - itsm-saas-network
    depends_on:
      itsm-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget --no-verbose --tries=1 --spider http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    logging: *default-logging
    mem_limit: "512m"
    cpus: "1.0"

  # Caddy 边缘反向代理 + 自动 Let's Encrypt TLS
  # 直接对外暴露 80/443；80 仅用于 ACME HTTP-01 挑战，实际业务全走 443。
  caddy:
    image: caddy:2-alpine
    container_name: itsm-saas-caddy
    hostname: caddy
    environment:
      # Caddyfile 内通过 {$SAAS_DOMAIN} / {$ACME_EMAIL} 引用
      SAAS_DOMAIN: ${SAAS_DOMAIN:?SAAS_DOMAIN must be set (e.g. itsm.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set (used for Let's Encrypt registration)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      itsm-frontend:
        condition: service_healthy
      itsm-backend:
        condition: service_healthy
    networks:
      - itsm-saas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "https://${SAAS_DOMAIN:?}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always
    logging: *default-logging
    mem_limit: "256m"
    cpus: "1.0"

volumes:
  itsm_saas_postgres_data:
    driver: local
  itsm_saas_redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  itsm-saas-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
