# ITSM SaaS — itsm.cloudmesh.top
# 宿主 nginx 反代到本地 docker 服务（frontend:30080, backend:38090）
# 部署时由 certbot 生成的证书路径：/etc/letsencrypt/live/itsm.cloudmesh.top/

# HTTP：ACME 挑战 + 全量跳 HTTPS
server {
    listen 80;
    server_name itsm.cloudmesh.top;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name itsm.cloudmesh.top;

    ssl_certificate     /etc/letsencrypt/live/itsm.cloudmesh.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itsm.cloudmesh.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 50m;

    # API → backend（保留 /api 前缀）
    location /api/ {
        proxy_pass http://127.0.0.1:38090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 边缘健康检查（供外部探测，不落后端）
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 前端 SPA → frontend
    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
