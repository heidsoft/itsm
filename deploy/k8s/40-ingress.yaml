apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itsm-ingress
  namespace: itsm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: itsm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: itsm-backend
                port: { number: 8090 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: itsm-frontend
                port: { number: 3000 }
