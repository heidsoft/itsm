name: Update Contributors Wall

# Keeps the README contributor avatar wall current without manual edits.
# Runs weekly and on manual dispatch only (NOT on push) so the commit it
# makes never re-triggers this workflow. New human contributors therefore
# appear within a week of their first merged PR.
on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate contributor wall
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update-contributors.py README.md README.en.md

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md README.en.md
            git commit -m "docs: 自动刷新贡献者头像墙"
            git push
          else
            echo "contributor wall already up to date"
          fi
