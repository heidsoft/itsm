name: ga-gate

# Integration gate only. Unit, lint and build checks live in backend-ci and
# frontend-ci; this workflow proves the assembled core stack can boot and serve.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'itsm-backend/**'
      - 'itsm-frontend/**'
      - 'docker-compose.dev.yml'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/ga-gate.yml'
  push:
    branches: [main]
    paths:
      - 'itsm-backend/**'
      - 'itsm-frontend/**'
      - 'docker-compose.dev.yml'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/ga-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ga-approved:
    name: GA Gate · Approved
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOYMENT_MODE: private
      COMPOSE_PROJECT_NAME: ga-gate-${{ github.run_id }}-${{ github.run_attempt }}
      # 开发环境一次性夹具（不得用于生产）：docker-compose.dev.yml pins ADMIN_PASSWORD=admin123.
      ITSM_ADMIN_USER: admin
      ITSM_ADMIN_PASS: admin123 # 开发环境一次性夹具，不得用于生产
      E2E_ADMIN_PASSWORD: admin123 # 开发环境一次性夹具，不得用于生产
      ITSM_E2E_ISOLATED_STACK: '1'
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      MAX_RETRIES: '120'
      RETRY_INTERVAL: '3'
      # Use official Docker Hub images in CI (GitHub runners have direct access)
      # DaoCloud proxy blocks requests from GitHub Actions IP ranges
      POSTGRES_IMAGE: pgvector/pgvector:pg17
      REDIS_IMAGE: redis:7-alpine
      MINIO_IMAGE: bitnami/minio:latest
      OLLAMA_IMAGE: ollama/ollama:latest
      PROMETHEUS_IMAGE: prom/prometheus:latest
      GRAFANA_IMAGE: grafana/grafana:10.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: itsm-frontend/package-lock.json

      - name: Install E2E dependencies and Chromium
        working-directory: itsm-frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose --env-file /dev/null -f docker-compose.dev.yml --profile dev config --quiet

      - name: Start core stack
        run: >-
          docker compose --env-file /dev/null -f docker-compose.dev.yml --profile dev
          up -d --build postgres redis itsm-init itsm-backend itsm-frontend

      - name: Wait for backend and frontend
        run: |
          for attempt in $(seq 1 60); do
            backend_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/api/v1/health || true)
            frontend_status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            if [ "$backend_status" = '200' ] && [ "$frontend_status" = '200' ]; then
              echo "Core stack ready after ${attempt} attempts"
              exit 0
            fi
            sleep 5
          done
          echo '::error::Core stack did not become healthy in time'
          exit 1

      - name: Run API smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh
        # PR-0.5: emit junit so the test-trend workflow has data to render
        env:
          SMOKE_JUNIT: ${{ runner.temp }}/smoke-junit.xml

      - name: Run TicketType HTTP and worker full-chain gate
        working-directory: itsm-frontend
        timeout-minutes: 5
        run: >-
          npx playwright test --config=playwright.ticket-type.config.ts
          ticket-type-full-chain.spec.ts --project=chromium

      - name: Upload TicketType E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga-gate-ticket-type-full-chain
          path: |
            itsm-frontend/playwright-report/ticket-type-full-chain/
            itsm-frontend/test-results/ticket-type-full-chain/
            itsm-frontend/test-results/ticket-type-full-chain.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Generate test trend summary
        # PR-0.5: keep the trend markdown alongside the gate so reviewers
        # can see the pass/fail/skip counts without digging through CI logs.
        if: always()
        run: |
          mkdir -p output/trend
          node scripts/test-trend.js \
            --baseline docs/testing/coverage-baseline.json \
            --out output/trend/test-trend.md \
            || echo '[trend] WARN trend generation failed; continuing'

      - name: Upload test trend artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ga-gate-trend
          path: |
            output/trend/test-trend.md
            ga-gate-compose.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure logs
        if: failure()
        run: >-
          docker compose --env-file /dev/null -f docker-compose.dev.yml --profile dev logs
          --no-color --tail=200 > ga-gate-compose.log

      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ga-gate-compose-logs
          path: ga-gate-compose.log
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --env-file /dev/null -f docker-compose.dev.yml --profile dev down -v --remove-orphans
