name: pg-disaster-recovery

# PostgreSQL disaster recovery and tenant isolation validation
# Runs backup/restore drills, RLS enforcement tests, and fencing token fault injection

on:
  schedule:
    # Weekly backup/restore drill every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  push:
    branches: [main, develop]
    paths:
      - 'itsm-backend/migration/**'
      - 'itsm-backend/internal/initialization/**'
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      - 'docs/pg-upgrade-runbook.md'
      - '.github/workflows/pg-disaster-recovery.yml'
  workflow_dispatch:
    inputs:
      drill_type:
        description: 'Drill type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - rls
          - fencing
          - all

permissions:
  contents: read

concurrency:
  group: pg-dr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-drill:
    name: Backup & Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKUP_DIR: /tmp/itsm-backups
      PGDATABASE: itsm_test
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # runner 自带 pg client 16，与 postgres:17 服务端版本不匹配会导致
      # pg_dump "server version mismatch" 直接失败，必须安装 17 客户端
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Start PostgreSQL 17
        run: |
          docker run -d --name pg-dr-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=itsm_test \
            -p 5432:5432 \
            postgres:17

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec pg-dr-test pg_isready -U postgres; then
              echo "PostgreSQL ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Build production backend image
        run: docker build --file itsm-backend/Dockerfile.prod --tag itsm-backend:dr --build-arg VERSION=dr-test itsm-backend

      - name: Bootstrap real application schema
        run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_USER=postgres -e DB_PASSWORD=postgres -e DB_NAME=itsm_test -e DB_SSLMODE=disable \
            -e JWT_SECRET=dr-test-only-jwt-secret-with-more-than-32-characters \
            -e DEPLOYMENT_MODE=private -e ITSM_BOOTSTRAP_ONLY=true \
            -e ITSM_AUTO_MIGRATE=true -e ITSM_AUTO_SEED=false -e RLS_MODE=off \
            itsm-backend:dr

      - name: Create backup directory
        run: mkdir -p ${{ env.BACKUP_DIR }}

      - name: Seed real tenant-scoped tables
        run: |
          docker exec -i pg-dr-test psql -v ON_ERROR_STOP=1 -U postgres -d itsm_test <<'EOSQL'
          INSERT INTO tenants (id, name, code, type, status, billing_enabled, timezone, created_at, updated_at)
          VALUES
            (9101, 'DR Tenant A', 'dr-tenant-a', 'standard', 'active', false, 'Asia/Shanghai', now(), now()),
            (9102, 'DR Tenant B', 'dr-tenant-b', 'standard', 'active', false, 'Asia/Shanghai', now(), now());
          INSERT INTO teams (name, code, status, tenant_id, created_at, updated_at)
          VALUES
            ('DR Team A1', 'dr-a1', 'active', 9101, now(), now()),
            ('DR Team A2', 'dr-a2', 'active', 9101, now(), now()),
            ('DR Team B1', 'dr-b1', 'active', 9102, now(), now());
          EOSQL

      - name: Run backup script
        run: |
          chmod +x scripts/backup.sh
          BACKUP_DIR=${{ env.BACKUP_DIR }} \
          PGHOME=/var/lib/postgresql \
          ./scripts/backup.sh full

      - name: List backups
        run: ls -lh ${{ env.BACKUP_DIR }}/

      - name: Verify backup
        run: |
          latest=$(ls -t ${{ env.BACKUP_DIR }}/itsm_full_*.dump 2>/dev/null | head -1)
          test -n "$latest"
          BACKUP_DIR=${{ env.BACKUP_DIR }} ./scripts/backup.sh verify "$latest"
          jq empty "${latest%.dump}.meta"

      - name: Simulate data corruption
        run: |
          docker exec pg-dr-test psql -U postgres -d itsm_test \
            -c "DROP TABLE teams CASCADE;"
          docker exec pg-dr-test psql -U postgres -d itsm_test \
            -c "SELECT count(*) FROM teams;" && exit 1 || true

      - name: Run restore
        run: |
          latest=$(ls -t ${{ env.BACKUP_DIR }}/itsm_full_*.dump 2>/dev/null | head -1)
          test -n "$latest"
          RESTORE_CONFIRM=yes BACKUP_DIR=${{ env.BACKUP_DIR }} ./scripts/restore.sh full "$latest"

      - name: Verify data restored
        run: |
          count=$(docker exec pg-dr-test psql -U postgres -d itsm_test -Atc "SELECT count(*) FROM teams WHERE tenant_id IN (9101, 9102);")
          if [ "$count" = "3" ]; then
            echo "Data restored successfully: $count rows"
          else
            echo "Expected 3 rows, got: $count"
            exit 1
          fi
          docker exec -i pg-dr-test psql -v ON_ERROR_STOP=1 -U postgres -d itsm_test <<'EOSQL'
          DO $$
          DECLARE table_count integer; migration_count integer; policy_count integer;
          BEGIN
            SELECT count(*) INTO table_count FROM pg_tables WHERE schemaname = 'public';
            SELECT count(*) INTO migration_count FROM schema_migrations;
            SELECT count(*) INTO policy_count FROM pg_policies WHERE schemaname = 'public';
            IF table_count < 100 THEN RAISE EXCEPTION 'restored schema too small: % tables', table_count; END IF;
            IF migration_count < 13 THEN RAISE EXCEPTION 'migration ledger incomplete: %', migration_count; END IF;
            IF policy_count < 10 THEN RAISE EXCEPTION 'RLS policies missing: %', policy_count; END IF;
          END $$;
          EOSQL

      - name: Cleanup
        if: always()
        run: |
          docker stop pg-dr-test 2>/dev/null || true
          docker rm pg-dr-test 2>/dev/null || true
          rm -rf ${{ env.BACKUP_DIR }}

  rls-validation:
    name: RLS Policy Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start PostgreSQL 17
        run: |
          docker run -d --name pg-rls-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=itsm_test \
            -p 5432:5432 \
            postgres:17

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if docker exec pg-rls-test pg_isready -U postgres; then
              echo "PostgreSQL ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build production backend image
        run: docker build --file itsm-backend/Dockerfile.prod --tag itsm-backend:rls --build-arg VERSION=rls-test itsm-backend

      - name: Bootstrap real application schema and RLS migrations
        run: |
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_USER=postgres -e DB_PASSWORD=postgres -e DB_NAME=itsm_test -e DB_SSLMODE=disable \
            -e JWT_SECRET=rls-test-only-jwt-secret-with-more-than-32-characters \
            -e DEPLOYMENT_MODE=private -e ITSM_BOOTSTRAP_ONLY=true \
            -e ITSM_AUTO_MIGRATE=true -e ITSM_AUTO_SEED=false -e RLS_MODE=off \
            itsm-backend:rls

      - name: Prepare non-superuser tenant fixtures
        run: |
          docker exec -i pg-rls-test psql -v ON_ERROR_STOP=1 -U postgres -d itsm_test <<'EOSQL'
            CREATE ROLE itsm_rls_test LOGIN PASSWORD 'rls-test-only';
            GRANT CONNECT ON DATABASE itsm_test TO itsm_rls_test;
            GRANT USAGE ON SCHEMA public TO itsm_rls_test;
            GRANT SELECT, INSERT, UPDATE, DELETE ON teams TO itsm_rls_test;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO itsm_rls_test;
            INSERT INTO teams (name, code, status, tenant_id, created_at, updated_at) VALUES
              ('Team A1', 'rls-a1', 'active', 9101, now(), now()),
              ('Team A2', 'rls-a2', 'active', 9101, now(), now()),
              ('Team B1', 'rls-b1', 'active', 9102, now(), now());
          EOSQL

      - name: Test RLS enforcement
        run: |
          docker exec -i pg-rls-test psql -v ON_ERROR_STOP=1 -U postgres -d itsm_test <<'EOSQL'
            SET ROLE itsm_rls_test;
            RESET app.current_tenant;
            DO $$ DECLARE n integer; BEGIN
              SELECT count(*) INTO n FROM teams;
              IF n <> 0 THEN RAISE EXCEPTION 'missing tenant context exposed % rows', n; END IF;
            END $$;

            SET app.current_tenant = '9101';
            DO $$ DECLARE n integer; blocked boolean := false; BEGIN
              SELECT count(*) INTO n FROM teams;
              IF n <> 2 THEN RAISE EXCEPTION 'tenant A expected 2 rows, got %', n; END IF;
              BEGIN
                INSERT INTO teams (name, code, status, tenant_id, created_at, updated_at)
                VALUES ('Cross tenant', 'rls-cross', 'active', 9102, now(), now());
              EXCEPTION WHEN insufficient_privilege THEN blocked := true;
              END;
              IF NOT blocked THEN RAISE EXCEPTION 'cross-tenant insert was accepted'; END IF;
            END $$;

            SET app.current_tenant = '9102';
            DO $$ DECLARE n integer; BEGIN
              SELECT count(*) INTO n FROM teams;
              IF n <> 1 THEN RAISE EXCEPTION 'tenant B expected 1 row, got %', n; END IF;
            END $$;
          EOSQL

      - name: Verify RLS is active
        run: |
          docker exec -i pg-rls-test psql -v ON_ERROR_STOP=1 -U postgres -d itsm_test <<'EOSQL'
          DO $$ DECLARE disabled integer; policies integer; BEGIN
            SELECT count(*) INTO disabled
            FROM pg_policies p JOIN pg_tables t USING (schemaname, tablename)
            WHERE p.schemaname = 'public' AND p.policyname LIKE 'tenant_isolation_%' AND NOT t.rowsecurity;
            SELECT count(*) INTO policies FROM pg_policies
            WHERE schemaname = 'public' AND policyname LIKE 'tenant_isolation_%';
            IF disabled <> 0 THEN RAISE EXCEPTION '% policy tables do not have RLS enabled', disabled; END IF;
            IF policies < 10 THEN RAISE EXCEPTION 'expected production RLS policy set, got %', policies; END IF;
          END $$;
          EOSQL

      - name: Cleanup
        if: always()
        run: |
          docker stop pg-rls-test 2>/dev/null || true
          docker rm pg-rls-test 2>/dev/null || true

  fencing-fault-injection:
    name: Fencing Token Fault Injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Run fencing token tests
        run: |
          cd itsm-backend
          # Run only the fencing token tests
          go test -v -run "TestFencingToken" ./internal/initialization/... -timeout 60s

      - name: Verify fence_test.go exists
        run: |
          if [ -f "itsm-backend/internal/initialization/fence_test.go" ]; then
            echo "fence_test.go exists and contains:"
            grep -c "func Test" itsm-backend/internal/initialization/fence_test.go | xargs -I {} echo "  {} test functions"
          else
            echo "ERROR: fence_test.go not found"
            exit 1
          fi

  pg-upgrade-verification:
    name: PG Upgrade Runbook Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify runbook exists
        run: |
          if [ -f "docs/pg-upgrade-runbook.md" ]; then
            echo "pg-upgrade-runbook.md exists"
            echo "---"
            head -30 docs/pg-upgrade-runbook.md
          else
            echo "ERROR: pg-upgrade-runbook.md not found"
            exit 1
          fi

      - name: Check runbook has required sections
        run: |
          required_sections=(
            "Pre-Upgrade Checklist"
            "Upgrade Procedure"
            "Post-Upgrade Validation"
            "Rollback Procedure"
          )
          for section in "${required_sections[@]}"; do
            if grep -q "$section" docs/pg-upgrade-runbook.md; then
              echo "✓ Found: $section"
            else
              echo "✗ Missing: $section"
              exit 1
            fi
          done

  ci-evidence-summary:
    name: CI Evidence Summary
    runs-on: ubuntu-latest
    needs: [backup-drill, rls-validation, fencing-fault-injection, pg-upgrade-verification]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate evidence summary
        run: |
          echo "=== PostgreSQL Disaster Recovery CI Evidence ==="
          echo ""
          echo "Run Date: $(date -Iseconds)"
          echo "Git Ref: ${{ github.ref }}"
          echo "Run ID: ${{ github.run_id }}"
          echo ""
          echo "Jobs:"
          echo "  - backup-drill: ${{ needs.backup-drill.result }}"
          echo "  - rls-validation: ${{ needs.rls-validation.result }}"
          echo "  - fencing-fault-injection: ${{ needs.fencing-fault-injection.result }}"
          echo "  - pg-upgrade-verification: ${{ needs.pg-upgrade-verification.result }}"
          echo ""

          # Check all required files exist
          echo "Artifacts:"
          for artifact in \
            "scripts/backup.sh" \
            "scripts/restore.sh" \
            "docs/pg-upgrade-runbook.md" \
            "itsm-backend/internal/initialization/fence_test.go" \
            "itsm-backend/migration/migrations.go"; do
            if [ -f "$artifact" ]; then
              echo "  ✓ $artifact"
            else
              echo "  ✗ $artifact (MISSING)"
            fi
          done

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg-dr-evidence
          path: |
            docs/pg-upgrade-runbook.md
            scripts/backup.sh
            scripts/restore.sh
          retention-days: 30
