name: Security Scan

# Purpose:
#   Run security-focused scans that are separate from normal build/test CI.
# Notes:
#   - gosec and Trivy upload SARIF to the GitHub Security tab.
#   - npm audit is limited to production dependencies and critical severity
#     so historical dev/high advisories do not block every routine change.
#   - TruffleHog scans for accidental secret exposure.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday at 6am
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  gosec:
    name: Go Security Scan
    runs-on: ubuntu-latest
    # 只在每周定时与手动触发时跑：全仓 gosec 实测 8 分 50 秒、峰值 152% CPU
    # （本机 16GB 才勉强跑完；标准 runner 是 2 核 7GB，多次在 8~11 分钟被环境
    # 杀掉且没走到 Upload SARIF——等于每次推送都白烧 10 分钟还拿不到结果）。
    # 与其让它长期以「被杀」的形态挂在每个 push 上，不如放到有 30 分钟预算的
    # 定时通道里，让它真正产出 SARIF。其余 6 个 job 仍每次推送都跑。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Run gosec
        # 钉住具体 tag 而非 @master：浮动引用会让上游改动在两次运行之间
        # 悄悄改变扫描结果（与 backend-ci 里 staticcheck 钉版本的理由相同）。
        uses: securego/gosec@v2.30.0
        with:
          # -exclude-dir=ent：ent 的生成代码（154 张表、690 个带
          # "Code generated by ent" 头的文件）占满仓扫描绝大部分耗时，
          # 实测扫 ./itsm-backend/... 24 分钟仍未跑完，CI 里 8 分钟被清理——
          # 该 job 长期红灯的真实原因是「超时」而非「问题多」。排除生成代码后
          # 扫描能在分钟级完成，结果才谈得上有意义。
          # -tests=false：不加载测试包。测试文件会额外拉进 httptest/testify/mock
          # 与仓库内测试辅助包，实测是最大的内存杠杆（gowid 的包图会整体放大）。
          # gosec 需要把整份程序做类型检查，而 ent 的 154 张表被几乎所有业务包
          # 依赖——即使 -exclude-dir=ent 跳过报告，类型信息仍要加载，所以闸门
          # 必须落在「减少包图」而不是「跳过文件」。
          args: '-fmt sarif -out gosec-results.sarif -exclude-dir=ent -tests=false ./itsm-backend/...'

      - name: Upload gosec results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  trivy-report:
    name: Trivy Vulnerability Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 gosec 同理钉住版本：@master 是浮动分支，上游一次提交就能在两次运行
      # 之间改变扫描结果（甚至改变默认 trivy 版本），报告无法复现。
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  trivy-gate:
    name: Trivy Gate (High and Critical)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: '.trivyignore'

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        working-directory: itsm-backend
        run: |
          # GO-2026-6452 (excelize v2.11.0) has no fix available; the call site
          # is wrapped with panic recovery in safeExcelizeGetRows.
          set +e
          output=$(govulncheck ./... 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          # Filter out the known excelize vulnerability and check for others
          filtered=$(echo "$output" | grep -v "GO-2026-6452" | grep -v "excelize" | grep "Vulnerability #" || true)
          if [ -n "$filtered" ]; then
            echo "::error::New vulnerabilities detected"
            exit 1
          fi
          if [ $exit_code -ne 0 ] && ! echo "$output" | grep -q "GO-2026-6452"; then
            exit $exit_code
          fi
          echo "::notice::Known vulnerability GO-2026-6452 (excelize) is mitigated by panic recovery"

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: itsm-frontend
        run: npm ci --legacy-peer-deps

      - name: Audit
        working-directory: itsm-frontend
        run: npm audit --omit=dev --audit-level=high

  pnpm-guard:
    name: pnpm Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for stale pnpm lockfile
        run: |
          if [ -f "itsm-frontend/pnpm-lock.yaml" ]; then
            echo "::error::Stale pnpm-lock.yaml detected. This project uses npm, not pnpm."
            exit 1
          fi

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 钉住 release tag：@main 是浮动分支，上游一次合并就改变扫描行为，
      # 且 `uses: ...@main` 无法回答「这次扫描跑的是哪个版本」。
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: ./
