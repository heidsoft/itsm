name: Security Scan

# Purpose:
#   Run security-focused scans that are separate from normal build/test CI.
# Notes:
#   - gosec and Trivy upload SARIF to the GitHub Security tab.
#   - npm audit is limited to production dependencies and critical severity
#     so historical dev/high advisories do not block every routine change.
#   - TruffleHog scans for accidental secret exposure.

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday at 6am
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  gosec:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./itsm-backend/...'

      - name: Upload gosec results
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  trivy-report:
    name: Trivy Vulnerability Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy

  trivy-gate:
    name: Trivy Gate (Critical Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: true
          cache-dependency-path: itsm-backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: itsm-backend
        run: govulncheck ./...

  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: itsm-frontend
        run: npm ci --legacy-peer-deps

      - name: Audit
        working-directory: itsm-frontend
        run: npm audit --omit=dev --audit-level=high

  pnpm-guard:
    name: pnpm Lockfile Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for stale pnpm lockfile
        run: |
          if [ -f "itsm-frontend/pnpm-lock.yaml" ]; then
            echo "::error::Stale pnpm-lock.yaml detected. This project uses npm, not pnpm."
            exit 1
          fi

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
