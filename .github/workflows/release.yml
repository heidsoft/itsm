name: Build & Release

# Purpose:
#   Produce public release artifacts from version tags.
# Trigger:
#   Push a tag like v1.0.2. Manual dispatch is intentionally not enabled
#   because releases must map to immutable git tags.
# Outputs:
#   - GitHub Release zip archives for backend binaries and frontend standalone
#   - GHCR images ghcr.io/heidsoft/itsm-backend and ghcr.io/heidsoft/itsm-frontend

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的 git tag（如 v1.6.12），用于手动重新触发发布'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  GOPROXY: "https://proxy.golang.org,direct"

jobs:
  build-backend:
    name: Build Backend (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: itsm-backend/go.mod
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOPROXY: "https://proxy.golang.org,direct"
          GONOSUMDB: "*"
        run: |
          cd itsm-backend
          go build -mod=mod -ldflags="-s -w" -o ../itsm-${{ matrix.goos }}-${{ matrix.goarch }} ./main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: itsm-backend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: itsm-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: itsm-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./itsm-frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: ./itsm-frontend
        run: npm run build
        env:
          # Public artifacts must not embed a developer-machine backend URL.
          NEXT_PUBLIC_API_URL: ''
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify standalone output
        working-directory: ./itsm-frontend
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "::error::Standalone build output not found at .next/standalone"
            exit 1
          fi
          echo "Standalone build verified"

      - name: Prepare frontend build
        working-directory: ./itsm-frontend
        run: |
          mkdir -p frontend-standalone
          cp -r .next/standalone/. frontend-standalone/ 2>/dev/null || true
          cp -r .next/static frontend-standalone/.next/ 2>/dev/null || true
          cp -r public frontend-standalone/public 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: itsm-frontend-build
          path: itsm-frontend/frontend-standalone
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    outputs:
      version: ${{ steps.resolve_version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: resolve_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Invalid tag format: $VERSION"
              exit 1
            fi
            # 验证 tag 存在
            git fetch --tags
            if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
              echo "::error::Tag $VERSION does not exist"
              exit 1
            fi
            git checkout "$VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: itsm-backend-*
          merge-multiple: true
          path: artifacts/backends

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: itsm-frontend-build
          path: artifacts/frontend

      - name: Create release archives
        run: |
          cd artifacts
          zip -r ../itsm-${{ steps.resolve_version.outputs.VERSION }}-backends.zip backends/
          zip -r ../itsm-${{ steps.resolve_version.outputs.VERSION }}-frontend.zip frontend/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.resolve_version.outputs.VERSION }}"
          VERSION_NO_V="${VERSION#v}"

          # 从 CHANGELOG.md 提取当前版本条目
          # 从 ## [version] 到下一个 ## [ 或文件末尾
          awk -v ver="$VERSION_NO_V" '
            $0 ~ "## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && NF { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG.md 未找到 $VERSION_NO_V 条目，使用自动生成"
            echo "use_auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_auto=false" >> "$GITHUB_OUTPUT"
            echo "提取 $VERSION_NO_V Release Notes:"
            head -20 release-notes.md
            echo "..."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            itsm-${{ steps.resolve_version.outputs.VERSION }}-backends.zip
            itsm-${{ steps.resolve_version.outputs.VERSION }}-frontend.zip
          body_path: ${{ steps.notes.outputs.use_auto == 'true' && '' || 'release-notes.md' }}
          generate_release_notes: ${{ steps.notes.outputs.use_auto == 'true' }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "## Release ${{ github.ref_name }} 完成" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 产物 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Release | https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend 镜像 | \`ghcr.io/${{ github.repository_owner }}/itsm-backend:${{ steps.resolve_version.outputs.VERSION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend 镜像 | \`ghcr.io/${{ github.repository_owner }}/itsm-frontend:${{ steps.resolve_version.outputs.VERSION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend 二进制 | \`itsm-${{ steps.resolve_version.outputs.VERSION }}-backends.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend 构建 | \`itsm-${{ steps.resolve_version.outputs.VERSION }}-frontend.zip\` |" >> "$GITHUB_STEP_SUMMARY"

  publish-containers:
    name: Publish Container Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    strategy:
      matrix:
        include:
          - name: backend
            context: ./itsm-backend
            file: ./itsm-backend/Dockerfile.prod
            image: ghcr.io/${{ github.repository_owner }}/itsm-backend
          - name: frontend
            context: ./itsm-frontend
            file: ./itsm-frontend/Dockerfile
            target: production
            image: ghcr.io/${{ github.repository_owner }}/itsm-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version for container tags
        id: container_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "IS_TAG=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "IS_TAG=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.title=ITSM ${{ matrix.name }}
            org.opencontainers.image.description=AI Native ITSM ${{ matrix.name }} image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
