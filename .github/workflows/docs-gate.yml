name: docs-gate

# Purpose:
#   Enforce documentation quality gates (HARD by default since 2026-09-23):
#     C.1 Hardcoded production credentials       (HARD)
#     C.2 Duplicate roadmap content             (HARD)
#     C.3 Broken internal markdown links        (HARD)
#     C.4 Release claims without commit/date/digest anchor (HARD)
#     C.5 Doc sync freshness                    (HARD)
#     C.6 Product drift                         (HARD)
#
#   2026-09-23 存量清零完成：6 道门禁 0 violation。run-all.sh 默认传 --strict，
#   所有 C.1–C.6 均 hard。workflow_dispatch 的 strict=false 可回退到 advisory。
#
# Triggers:
#   - PRs and pushes that touch markdown, .env, docs-gate scripts, or the code
#     surfaces that Gate C.6 ratchets (handlers, ent schema, bootstrap, frontend pages).
#   - Changes to this workflow file.
#
# Behavior:
#   - Runs scripts/docs-gate/run-all.sh --strict on every relevant change.
#   - Any violation (C.1–C.6) blocks the build.
#   - Uploads violation report as artifact regardless of pass/fail.

on:
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - '.env'
      - '.env.dev'
      - '.env.prod'
      - 'scripts/docs-gate/**'
      - '.github/workflows/docs-gate.yml'
      # gate-unit-tests 现在整目录跑 scripts/__tests__/*.test.js；这些是被测对象，
      # 不列进来则「改了被测脚本却不触发测试」，守卫会静默假绿。
      - 'scripts/__tests__/**'
      - 'scripts/build-images.sh'
      - 'scripts/deploy-prod.sh'
      - 'scripts/test-trend.js'
      - 'scripts/generate-acl-manifest.js'
      - 'docker-compose.prod.yml'
      # Gate C.6 ratchets and wiring checks read these paths directly;
      # without them here, drift introduced by a pure-code PR would never be gated.
      - 'itsm-backend/handlers/**'
      - 'itsm-backend/ent/schema/**'
      - 'itsm-backend/internal/bootstrap/**'
      - 'itsm-backend/service/**'
      - 'itsm-frontend/src/app/**'
      - 'itsm-frontend/jest.config.js'
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - '**.mdx'
      - '.env'
      - '.env.dev'
      - '.env.prod'
      - 'scripts/docs-gate/**'
      - '.github/workflows/docs-gate.yml'
      # gate-unit-tests 现在整目录跑 scripts/__tests__/*.test.js；这些是被测对象，
      # 不列进来则「改了被测脚本却不触发测试」，守卫会静默假绿。
      - 'scripts/__tests__/**'
      - 'scripts/build-images.sh'
      - 'scripts/deploy-prod.sh'
      - 'scripts/test-trend.js'
      - 'scripts/generate-acl-manifest.js'
      - 'docker-compose.prod.yml'
      - 'itsm-backend/handlers/**'
      - 'itsm-backend/ent/schema/**'
      - 'itsm-backend/internal/bootstrap/**'
      - 'itsm-backend/service/**'
      - 'itsm-frontend/src/app/**'
      - 'itsm-frontend/jest.config.js'
  workflow_call:
    inputs:
      strict:
        description: 'Enable hard mode (v2.0+). Default: advisory only.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable hard mode (v2.0+). Default: advisory only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  gate-unit-tests:
    # The gate scripts encode their own regression tests (injection -> FAIL,
    # compliant -> PASS). Run the whole __tests__ directory: previously only
    # docs-gate.test.js ran here, leaving 3 test files with no runner at all.
    # The other triggers above list the scripts these tests read, so editing a
    # script under test actually re-runs its guard.
    name: Script Guard Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run all script guard tests
        run: node --test scripts/__tests__/*.test.js

  gate:
    name: Docs Gate (C.6 hard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate git ls-files

      - name: Setup Bash
        run: bash --version

      - name: Run docs-gate
        id: gate
        run: |
          set -uo pipefail
          # Default hard since 2026-09-23 backlog cleared.
          # workflow_dispatch input `strict=false` overrides to advisory mode.
          if [ "${{ inputs.strict }}" = "false" ]; then
            echo "[docs-gate] Advisory mode (strict=false). C.1–C.5 will not block."
            ./scripts/docs-gate/run-all.sh | tee docs-gate-report.txt
          else
            echo "[docs-gate] Hard mode (--strict). All 6 gates block on violation."
            ./scripts/docs-gate/run-all.sh --strict | tee docs-gate-report.txt
          fi

      - name: Annotate violations
        if: always()
        run: |
          set -uo pipefail
          if [ -s docs-gate-report.txt ]; then
            echo "::group::Docs Gate Report"
            cat docs-gate-report.txt
            echo "::endgroup::"
          fi

      - name: Upload report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-gate-report
          path: docs-gate-report.txt
          retention-days: 14
          if-no-files-found: warn
