name: docs-gate

# Purpose:
#   Enforce documentation quality gates:
#     C.1 Hardcoded production credentials       (hard only with --strict)
#     C.2 Duplicate roadmap content             (hard only with --strict)
#     C.3 Broken internal markdown links        (hard only with --strict)
#     C.4 Release claims without commit/date/digest anchor (hard only with --strict)
#     C.5 Doc sync freshness                    (hard only with --strict)
#     C.6 Product drift                         (HARD by default, no --strict needed)
#
#   NOTE: run-all.sh is invoked below WITHOUT --strict, so C.1–C.5 currently
#   report without blocking (2026-09-22 measured: 59 broken links, 22 unanchored
#   claims, summary still "0 failed"). Only C.6 blocks today. Flip the invocation
#   to `run-all.sh --strict` after the C.1–C.5 backlog is cleared.
#
# Triggers:
#   - PRs and pushes that touch markdown, .env, docs-gate scripts, or the code
#     surfaces that Gate C.6 ratchets (handlers, ent schema, bootstrap, frontend pages).
#   - Changes to this workflow file.
#
# Behavior:
#   - Runs scripts/docs-gate/run-all.sh on every relevant change.
#   - Gate C.6 violations block the build.
#   - Uploads violation report as artifact regardless of pass/fail.

on:
  pull_request:
    paths:
      - '**.md'
      - '**.mdx'
      - '.env'
      - '.env.dev'
      - '.env.prod'
      - 'scripts/docs-gate/**'
      - '.github/workflows/docs-gate.yml'
      # Gate C.6 ratchets and wiring checks read these paths directly;
      # without them here, drift introduced by a pure-code PR would never be gated.
      - 'itsm-backend/handlers/**'
      - 'itsm-backend/ent/schema/**'
      - 'itsm-backend/internal/bootstrap/**'
      - 'itsm-backend/service/**'
      - 'itsm-frontend/src/app/**'
      - 'itsm-frontend/jest.config.js'
  push:
    branches: [main, develop]
    paths:
      - '**.md'
      - '**.mdx'
      - '.env'
      - '.env.dev'
      - '.env.prod'
      - 'scripts/docs-gate/**'
      - '.github/workflows/docs-gate.yml'
      - 'itsm-backend/handlers/**'
      - 'itsm-backend/ent/schema/**'
      - 'itsm-backend/internal/bootstrap/**'
      - 'itsm-backend/service/**'
      - 'itsm-frontend/src/app/**'
      - 'itsm-frontend/jest.config.js'
  workflow_call:
    inputs:
      strict:
        description: 'Enable hard mode (v2.0+). Default: advisory only.'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      strict:
        description: 'Enable hard mode (v2.0+). Default: advisory only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  gate-unit-tests:
    # The gate scripts encode their own regression tests (injection -> FAIL,
    # compliant -> PASS). Without this job those tests never run in CI, so a
    # gate that silently stopped detecting anything would stay green forever.
    name: Docs Gate Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run docs-gate script tests
        run: node --test scripts/__tests__/docs-gate.test.js

  gate:
    name: Docs Gate (C.6 hard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for accurate git ls-files

      - name: Setup Bash
        run: bash --version

      - name: Run docs-gate
        id: gate
        run: |
          set -uo pipefail
          echo "[docs-gate] C.6 (product drift) is hard; C.1-C.5 are advisory unless --strict is passed."
          ./scripts/docs-gate/run-all.sh | tee docs-gate-report.txt

      - name: Annotate violations
        if: always()
        run: |
          set -uo pipefail
          if [ -s docs-gate-report.txt ]; then
            echo "::group::Docs Gate Report"
            cat docs-gate-report.txt
            echo "::endgroup::"
          fi

      - name: Upload report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-gate-report
          path: docs-gate-report.txt
          retention-days: 14
          if-no-files-found: warn
