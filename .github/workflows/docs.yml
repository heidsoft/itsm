name: docs

on:
  pull_request:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'ROADMAP.md'
      - 'UPGRADE.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.markdownlint.json'
      - '.env.prod.example'
      - 'itsm-backend/go.mod'
      - 'itsm-backend/main.go'
      - 'itsm-backend/router/**'
      - 'itsm-backend/handlers/mcp/**'
      - 'itsm-frontend/package.json'
      - 'deploy/k8s/**'
      - 'scripts/check-version-consistency.js'
      - 'scripts/__tests__/version-consistency.test.js'
      - 'scripts/version-drift-baseline.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-gate.yml'
      - 'scripts/docs-gate/**'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'ROADMAP.md'
      - 'UPGRADE.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.env.prod.example'
      - 'itsm-backend/go.mod'
      - 'itsm-backend/main.go'
      - 'itsm-backend/router/**'
      - 'itsm-backend/handlers/mcp/**'
      - 'itsm-frontend/package.json'
      - 'deploy/k8s/**'
      - 'scripts/check-version-consistency.js'
      - 'scripts/__tests__/version-consistency.test.js'
      - 'scripts/version-drift-baseline.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-gate.yml'
      - 'scripts/docs-gate/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: pip install --requirement requirements-docs.txt
      - name: Build documentation
        run: mkdocs build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Documentation quality gates (advisory in v1.5, hard in v2.0).
  # Runs in parallel with `build` so reviewers see the violation report.
  # See scripts/docs-gate/run-all.sh and docs/delivery/release-guide.md for rationale.
  docs-gate:
    name: Docs Gate (advisory)
    uses: ./.github/workflows/docs-gate.yml
    with:
      strict: false

  version-truth:
    name: Version Truth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve canonical version from git tag
        id: version
        run: echo "value=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Check all version surfaces
        run: node scripts/check-version-consistency.js --canonical="${{ steps.version.outputs.value }}" --strict
      - name: Run version guard tests
        run: node --test scripts/__tests__/version-consistency.test.js

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
