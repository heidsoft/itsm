services:
  # PostgreSQL 数据库（生产环境）
  postgres:
    image: pgvector/pgvector:pg17
    container_name: itsm-postgres-prod
    hostname: postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-itsm_prod}
      POSTGRES_USER: ${DB_USER:-itsm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    networks:
      - itsm-prod-network
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-itsm} -d ${DB_NAME:-itsm_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # Redis 缓存（生产环境）
  redis:
    image: redis:7-alpine
    container_name: itsm-redis-prod
    hostname: redis
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 2gb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
      --save 60 10000 --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_prod_data:/data
    networks:
      - itsm-prod-network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
          "ping",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # MinIO 对象存储（可选，默认不启动）
  #
  # 当前后端（Go）与前端代码均未使用 MinIO/S3——全仓对 MINIO_* 的引用只存在于
  # compose 文件自身。因此该服务移入 "storage" profile，默认不参与启动，
  # 避免让新部署者为一个用不到的组件准备凭据。
  #
  # 需要时启用：docker compose --env-file .env.prod -f docker-compose.prod.yml --profile storage up -d minio
  minio:
    image: minio/minio:latest
    container_name: itsm-minio-prod
    hostname: minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio_prod_data:/data
    networks:
      - itsm-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # ITSM 后端服务（生产环境）
  itsm-init:
    image: itsm-backend:${VERSION:-latest}
    container_name: itsm-init-prod
    hostname: init
    command: ["./main"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - LOG_LEVEL=error
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-private}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set - without it no admin account is created and you cannot sign in}
      - ITSM_BOOTSTRAP_ONLY=true
      - ITSM_AUTO_MIGRATE=true
      - ITSM_AUTO_SEED=true
      # Bootstrap flow:
      # The init container takes the legacy ADMIN_PASSWORD path so the admin user
      # is created in one shot. BOOTSTRAP_TOKEN_ENABLED=0 is what selects that
      # path; itsm-backend below keeps it at 1 and therefore skips admin creation
      # (seeder returns early when bootstrap is enabled).
      # The bootstrap-token flow would instead require a separate two-step
      # generate-token + consume-token API dance (planned post-pilot).
      #
      # NOTE: do not re-add a BOOTSTRAP_TOKEN_ENABLED=1 line above this one —
      # a duplicate key in the same environment list is silently overridden by
      # the last occurrence, which previously made this file self-contradictory.
      - BOOTSTRAP_TOKEN_ENABLED=${BOOTSTRAP_TOKEN_ENABLED:-0}
      - RLS_MODE=off
      - RLS_TENANT_VAR_NAME=app.current_tenant
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-prod-network
    restart: "no"

  # ITSM 后端服务（生产环境）
  itsm-backend:
    image: itsm-backend:${VERSION:-latest}
    build:
      context: ./itsm-backend
      dockerfile: Dockerfile.prod
    container_name: itsm-backend-prod
    hostname: backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      # Redis 配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0

      # 服务配置
      - SERVER_ENV=production
      - SERVER_HOST=0.0.0.0
      # Reported by GET /api/v1/version. Tied to the image tag so the API, the
      # running image and the release version cannot drift apart.
      - APP_VERSION=${VERSION:-1.6.9}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set - without it no admin account is created and you cannot sign in}
      - BOOTSTRAP_TOKEN_ENABLED=${BOOTSTRAP_TOKEN_ENABLED:-1}

      # JWT 配置（生产环境必须更改！）
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRE_TIME=86400
      - JWT_REFRESH_EXPIRE_TIME=604800

      # 日志配置
      - LOG_LEVEL=error
      - LOG_PATH=/app/logs
      - LOG_FORMAT=json
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-private}
      - ITSM_AUTO_MIGRATE=false
      - ITSM_AUTO_SEED=false
      - ITSM_PROCESS_MODE=api
      # RLS pilot — driver decorator wired, policies enforced on changes/vectors
      - RLS_MODE=${RLS_MODE:-enforce}
      - RLS_TENANT_VAR_NAME=${RLS_TENANT_VAR_NAME:-app.current_tenant}

      # 对象存储（生产用 S3 或 MinIO）
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-itsm-uploads}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}

      # Proxy bypass for health checks
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1

      # LLM 配置（生产环境）
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}

      # AI 能力就绪标记（/api/v1/capabilities 中 ai 的 deploymentReady）
      - ITSM_AI_READY=${ITSM_AI_READY:-}

      # Guidance sidecar 地址：指向 itsm-ai-service 的受限分诊端点 /triage
      # （默认 localhost:8091；生产由该服务接管，triage 走受限生成路径）
      - GUIDANCE_URL=${GUIDANCE_URL:-http://itsm-ai-service:8000}

      # 告警通知
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@yourdomain.com}

      - DINGTALK_WEBHOOK=${DINGTALK_WEBHOOK:-}
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}

      # 其他配置
      - ENABLE_CORS=true
      - ITSM_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      itsm-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-prod-network
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= curl -fsS http://localhost:8090/api/v1/readyz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  # Guidance sidecar（受限 JSON 生成）。复用 itsm-ai-service：POST /triage 提供
  # 与后端 GuidanceClient 兼容的分类响应，GET /health 提供健康检查。
  # triage 由此获得独立于 LLM gateway 的受限生成路径；sidecar 不可用时后端自动降级。
  itsm-ai-service:
    image: itsm-ai-service:${VERSION:-latest}
    build:
      context: ./itsm-ai-service
      dockerfile: Dockerfile
    container_name: itsm-ai-service-prod
    hostname: ai-service
    environment:
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8000
      - LOG_LEVEL=${AI_LOG_LEVEL:-info}
      - CORS_ORIGINS=http://itsm-frontend:3000,http://nginx
      # 直连 LLM provider（OpenAI 兼容）。与后端共用同一套 LLM 凭据。
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_ENDPOINT:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
      - LLM_TIMEOUT=120
    expose:
      - "8000"
    networks:
      - itsm-prod-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

  # 可靠命令、SLA、升级和索引调度器。与 API 使用同一镜像但不监听 HTTP。
  itsm-worker:
    image: itsm-backend:${VERSION:-latest}
    container_name: itsm-worker-prod
    hostname: worker
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-itsm}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-itsm_prod}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - REDIS_DB=0
      - SERVER_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - LOG_LEVEL=error
      - LOG_PATH=/app/logs
      - LOG_FORMAT=json
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-private}
      - ITSM_AUTO_MIGRATE=false
      - ITSM_AUTO_SEED=false
      - ITSM_PROCESS_MODE=worker
      # RLS pilot — worker uses enforce mode same as backend
      - RLS_MODE=${RLS_MODE:-enforce}
      - RLS_TENANT_VAR_NAME=${RLS_TENANT_VAR_NAME:-app.current_tenant}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-itsm-uploads}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      itsm-init:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads:rw
      - ./config:/app/config:ro
    networks:
      - itsm-prod-network
    healthcheck:
      # Worker mode intentionally does not expose the Web API port. Check the
      # long-running PID instead of inheriting the backend image HTTP probe.
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 35s
    restart: always

  # ITSM 前端服务（生产环境）
  itsm-frontend:
    build:
      context: ./itsm-frontend
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
        - ITSM_BACKEND_URL=http://itsm-backend:8090
        - NEXT_PUBLIC_ENABLE_AI=${NEXT_PUBLIC_ENABLE_AI:-true}
        # NEXT_PUBLIC_* are baked at build time. Leave empty so the bundle
        # routes API traffic through nginx (browser → nginx:80 → backend:8090)
        # instead of calling the backend container directly. See Fix #5.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_API_VERSION=${NEXT_PUBLIC_API_VERSION:-v1}
        - NEXT_PUBLIC_API_TIMEOUT=${NEXT_PUBLIC_API_TIMEOUT:-30000}
    container_name: itsm-frontend-prod
    hostname: frontend
    environment:
      - NODE_ENV=production
      - ITSM_BACKEND_URL=http://itsm-backend:8090
      - no_proxy=localhost,127.0.0.1
      - NO_PROXY=localhost,127.0.0.1
    # NOTE: port 3000 is intentionally NOT published to the host in production.
    # All browser traffic MUST go through nginx on 80/443 so that X-Real-IP /
    # X-Forwarded-For are populated and audit logs (Fix #5) record the real
    # client IP instead of leaking the frontend container's bridge IP
    # (172.28.0.7). The internal port 3000 is still reachable from nginx via
    # the itsm-prod-network bridge.
    expose:
      - "3000"
    volumes:
      - ./uploads:/app/public/uploads:ro
    networks:
      - itsm-prod-network
    depends_on:
      itsm-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget --no-verbose --tries=1 --spider http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # Nginx 反向代理（生产环境）
  nginx:
    image: nginx:alpine
    container_name: itsm-nginx-prod
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      itsm-frontend:
        condition: service_healthy
      itsm-backend:
        condition: service_healthy
    networks:
      - itsm-prod-network
    healthcheck:
      test: ["CMD", "sh", "-c", "http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget --no-verbose --tries=1 --spider http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local

networks:
  itsm-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
