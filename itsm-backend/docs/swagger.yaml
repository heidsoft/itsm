      priority:
        enum:
        - low
        - medium
        - high
        - critical
        - urgent
        type: string
      requesterId:
        description: 创建人ID
        type: integer
      resolution:
        type: string
      status:
        enum:
        - new
        - open
        - assigned
        - in_progress
        - pending
        - resolved
        - closed
        - cancelled
        - approved
        - rejected
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 200
        minLength: 2
        type: string
      type:
        enum:
        - incident
        - service_request
        - change
        - ticket
        - problem
        - improvement
        type: string
      userId:
        description: 操作用户ID (后端自动填充)
        type: integer
      version:
        description: 版本号（乐观锁）
        type: integer
    type: object
  dto.UpdateUserRequest:
    properties:
      department:
        description: |-
          Department/Phone 用指针：PATCH 需区分「未传」与「传空串清空」——非指针下
          空串被 omitempty 当未传，字段永远清不掉（AGENTS.md PATCH 指针规则）。
        type: string
      email:
        type: string
      mspRole:
        description: |-
          MSP 员工身份（provider_admin|provider_agent|customer_user）。

          指针语义：nil=保持不变；空串=清空；非空=设为该身份。
          它与 RoleIDs 里的「MSP管理员」附加角色是两条互不相通的链路：MSP 工作台
          门控只认本字段（middleware.IsMSPStaff），不认附加角色。编辑用户时必须
          能写它，否则「把某人设为 MSP 员工」在产品上无法完成（prod 实测 O4）。
        enum:
        - provider_admin
        - provider_agent
        - customer_user
        type: string
      name:
        maxLength: 100
        minLength: 1
        type: string
      phone:
        type: string
      role:
        description: 角色更新，仅管理员有权限更新
        enum:
        - super_admin
        - admin
        - sysadmin
        - security_admin
        - audit_admin
        - it_admin
        - manager
        - agent
        - technician
        - end_user
        - user
        type: string
      roleIds:
        description: RBAC 多角色替换集（非 nil 时整体替换 user_roles 边）；空数组表示清空
        items:
          type: integer
        type: array
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  dto.UserDTO:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  dto.UserDetailResponse:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      department:
        type: string
      email:
        type: string
      id:
        type: integer
      mspRole:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
      roleIds:
        description: RBAC 多角色（user_roles M2M 边），供前端编辑表单回填
        items:
          type: integer
        type: array
      roleNames:
        items:
          type: string
        type: array
      tenantId:
        type: integer
      updatedAt:
        type: string
      username:
        type: string
    type: object
  dto.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  dto.ValidateResetTokenRequest:
    properties:
      email:
        type: string
      token:
        type: string
    required:
    - email
    - token
    type: object
  incident.IncidentReport:
    properties:
      avgResolutionMinutes:
        type: integer
      byPriority:
        items:
          $ref: '#/definitions/incident.IncidentStatCount'
        type: array
      byStatus:
        items:
          $ref: '#/definitions/incident.IncidentStatCount'
        type: array
      createdInWindow:
        type: integer
      dailyTrend:
        items:
          $ref: '#/definitions/incident.IncidentTrendPoint'
        type: array
      resolvedInWindow:
        type: integer
      window:
        $ref: '#/definitions/incident.IncidentReportWindow'
    type: object
  incident.IncidentReportWindow:
    properties:
      dateFrom:
        type: string
      dateTo:
        type: string
      days:
        type: integer
    type: object
  incident.IncidentStatCount:
    properties:
      count:
        type: integer
      value:
        type: string
    type: object
  incident.IncidentTrendPoint:
    properties:
      created:
        type: integer
      date:
        type: string
      resolved:
        type: integer
    type: object
  marketplace.InstallationResponse:
    properties:
      autoUpgrade:
        type: boolean
      config:
        additionalProperties: true
        type: object
      deliverable:
        type: boolean
      errorMessage:
        type: string
      id:
        type: integer
      installedAt:
        type: string
      installedBy:
        type: string
      installedVersion:
        type: string
      itemDescription:
        type: string
      itemIconUrl:
        type: string
      itemId:
        type: integer
      itemName:
        description: |-
          以下字段来自安装记录的商品边：安装列表的展示与过滤靠它们，
          前端不应再拉一次目录来「补齐名称/描述」——那是第二次真相来源。
          边未加载时留空（不是「没有新版本」）：界面必须把「不知道」和
          「已最新」区分开，否则升级按钮会在数据缺失时消失。
        type: string
      itemTitle:
        type: string
      itemType:
        type: string
      lastUpdatedAt:
        type: string
      lastUsedAt:
        type: string
      latestVersion:
        type: string
      status:
        type: string
      tenantId:
        type: integer
      upgradeAvailable:
        type: boolean
    type: object
  marketplace.autoUpgradeRequest:
    properties:
      autoUpgrade:
        type: boolean
    type: object
  marketplace.upgradeRequest:
    properties:
      targetVersion:
        type: string
    type: object
  notification.ChannelStatus:
    properties:
      blockedReason:
        type: string
      channel:
        type: string
      checkedAt:
        type: string
      deliverable:
        type: boolean
      healthMessage:
        type: string
      healthy:
        type: boolean
      lastSendError:
        type: string
      lastSendFailureAt:
        type: string
      lastSendSuccessAt:
        type: string
      provider:
        type: string
      recipientTarget:
        type: string
      type:
        type: string
    type: object
info:
  contact: {}
  description: AI-Native ITSM 平台 API：ITIL v4 核心流程（工单/事件/问题/变更/发布/服务请求）、CMDB、BPMN 工作流、知识库
    RAG、SLA、RBAC 与多租户隔离。
  title: ITSM API
  version: 1.6.61
paths:
  /api/dashboard:
    get:
      description: 获取仪表盘KPI指标、资源分布和健康状态数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取仪表盘数据
      tags:
      - dashboard
  /api/dashboard/resources/distribution:
    get:
      description: 获取多云资源分布数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.MultiCloudResourceData'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取资源分布数据
      tags:
      - dashboard
  /api/dashboard/resources/health:
    get:
      description: 获取资源健康状态数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ResourceHealthData'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取资源健康状态
      tags:
      - dashboard
  /api/v1/analytics/export:
    post:
      consumes:
      - application/json
      description: 导出分析数据为 CSV 或 Excel；PDF 渲染器尚未接入，显式拒绝。
      parameters:
      - description: 导出请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DeepAnalyticsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 导出分析数据
      tags:
      - 数据分析
  /api/v1/analytics/tickets:
    get:
      description: 聚合工单的 status / priority 分布与 30 天趋势
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 获取工单分析概览
      tags:
      - 数据分析
  /api/v1/applications:
    get:
      consumes:
      - application/json
      description: 获取所有应用列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 获取应用列表
      tags:
      - 应用管理
    post:
      consumes:
      - application/json
      description: 创建新的应用
      parameters:
      - description: 应用信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 创建应用
      tags:
      - 应用管理
  /api/v1/applications/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定应用
      parameters:
      - description: 应用ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 删除应用
      tags:
      - 应用管理
    put:
      consumes:
      - application/json
      description: 更新应用信息
      parameters:
      - description: 应用ID
        in: path
        name: id
        required: true
        type: integer
      - description: 应用信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 更新应用
      tags:
      - 应用管理
  /api/v1/applications/microservices:
    get:
      consumes:
      - application/json
      description: 获取所有微服务列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 获取微服务列表
      tags:
      - 应用管理
    post:
      consumes:
      - application/json
      description: 创建新的微服务
      parameters:
      - description: 微服务信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 创建微服务
      tags:
      - 应用管理
  /api/v1/applications/microservices/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定微服务
      parameters:
      - description: 微服务ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 删除微服务
      tags:
      - 应用管理
    put:
      consumes:
      - application/json
      description: 更新微服务信息
      parameters:
      - description: 微服务ID
        in: path
        name: id
        required: true
        type: integer
      - description: 微服务信息
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 更新微服务
      tags:
      - 应用管理
  /api/v1/audit-logs:
    get:
      consumes:
      - application/json
      description: 根据过滤条件分页查询审计日志
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户ID
        in: query
        name: userId
        type: integer
      - description: 资源类型
        in: query
        name: resource
        type: string
      - description: 动作
        in: query
        name: action
        type: string
      - description: HTTP方法
        in: query
        name: method
        type: string
      - description: 状态码
        in: query
        name: statusCode
        type: integer
      - description: 路径前缀
        in: query
        name: path
        type: string
      - description: 请求ID
        in: query
        name: requestId
        type: string
      - description: 开始时间(RFC3339)
        in: query
        name: from
        type: string
      - description: 结束时间(RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
      summary: 列出审计日志
      tags:
      - AuditLogs
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 发起密码找回。service 以 5003 明确表达「邮件服务未配置」，不会让调用方误以为邮箱填错而反复重试。公开端点。
      parameters:
      - description: 找回请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "503":
          description: 邮件服务未配置(5003)
      summary: 申请密码重置
      tags:
      - 认证管理
  /api/v1/auth/menus:
    get:
      description: 按当前用户角色过滤后返回可见菜单（前端 layout 动态路由数据源）。仅需认证，不按菜单细粒度权限守卫。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 后端故障
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取当前用户菜单
      tags:
      - 菜单与导航
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 注册新账号。用户名被占用/自助注册未开放等业务拒绝按分类码返回，不统一压成认证失败。公开端点，无需 Bearer Token。
      parameters:
      - description: 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "409":
          description: 用户名已占用
        "500":
          description: 后端故障
      summary: 用户自助注册
      tags:
      - 认证管理
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 凭重置令牌设置新密码；令牌无效/过期返回认证失败。公开端点。
      parameters:
      - description: 重置请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "401":
          description: 令牌无效或过期
      summary: 重置密码
      tags:
      - 认证管理
  /api/v1/auth/session:
    get:
      description: 返回认证用户身份、可切换租户列表，以及服务端时钟计算的 access token 剩余秒数
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/common.SessionResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取当前会话
      tags:
      - 认证
  /api/v1/auth/sso/callback:
    post:
      consumes:
      - application/json
      description: 用授权码与 state 完成登录，建立会话（cookie）并记录登录审计；失败审计为 LOGIN_FAILED。公开端点。
      parameters:
      - description: 提供方编码
        in: query
        name: provider
        type: string
      - description: 回调参数(code/state)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SSOCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "401":
          description: 回调校验失败
      summary: SSO 回调
      tags:
      - 单点登录
  /api/v1/auth/sso/initiate:
    post:
      consumes:
      - application/json
      description: 生成授权请求并返回跳转 URL/state；provider 缺省 default。携带有效会话凭证时自动转入绑定模式，回调校验会话未变，避免「点绑定变成重新登录」。公开端点。
      parameters:
      - description: SSO 发起请求（可为空）
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.SSOInitiateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 提供方未启用
        "500":
          description: 后端故障
      summary: 发起 SSO 登录
      tags:
      - 单点登录
  /api/v1/auth/sso/providers:
    get:
      description: 登录页数据源：按 tenantCode 列出已启用提供方，不暴露密钥等配置细节。公开端点。
      parameters:
      - description: 租户编码
        in: query
        name: tenantCode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 提供方数组
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 查询失败
      summary: 列出启用的 SSO 提供方
      tags:
      - 单点登录
  /api/v1/auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: 为已认证用户切换当前租户，校验其属于目标租户后签发新的 access/refresh token 并写入会话 cookie；越权返回
        403。
      parameters:
      - description: 目标租户
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.SwitchTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "401":
          description: 未认证
        "403":
          description: 不属于目标租户
      security:
      - BearerAuth: []
      summary: 切换租户
      tags:
      - 认证管理
  /api/v1/auth/validate-reset-token:
    post:
      consumes:
      - application/json
      description: 校验密码重置令牌是否有效，供前端在展示重置表单前预检。公开端点。
      parameters:
      - description: 令牌校验请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ValidateResetTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.Response'
        "400":
          description: 参数错误
        "401":
          description: 令牌无效或过期
      summary: 校验重置令牌
      tags:
      - 认证管理
  /api/v1/bpmn/ai/generate:
    post:
      consumes:
      - application/json
      description: 根据用户输入的业务需求自动生成BPMN工作流定义
      parameters:
      - description: 生成请求
        in: body
