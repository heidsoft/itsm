            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CloudAccountListResponse'
              type: object
        "400":
          description: provider 不在六个规范值内
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 租户上下文缺失
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 云账号列表
      tags:
      - CMDB-云资源
    post:
      consumes:
      - application/json
      description: 租户级云账号。credentialRef 只是凭据的引用标识（不落明文密钥），写入后经校验保存，读取侧仅外露 hasCredential。provider
        只接受六个规范值。
      parameters:
      - description: 云账号
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CloudAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CloudAccountResponse'
              type: object
        "400":
          description: provider 枚举外 / 必填缺失 / credentialRef 跨租户引用
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 租户上下文缺失
          schema:
            $ref: '#/definitions/common.Response'
        "403":
          description: 缺少 cmdb write 权限
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 新增云账号
      tags:
      - CMDB-云资源
