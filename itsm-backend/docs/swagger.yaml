          type: integer
        type: object
      duplicateCiCount:
        description: DuplicateCICount 是参与重复组的 CI 条数（同一组 2 条记 2）。
        type: integer
      duplicateGroups:
        description: |-
          DuplicateGroups 是 CI 之间的重复聚类结果（此前 duplicate 分桶只统计
          「同一批发现结果里同一资源出现两次」，从不做 CI 间比对，恒为 0）。
