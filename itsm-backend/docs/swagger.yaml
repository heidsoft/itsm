  /api/v1/dashboard/ticket-trend:
    get:
      consumes:
      - application/json
      description: 按天聚合最近 N 天（默认 7 天）的工单趋势：待处理/进行中/已解决/已关闭/新建，并派生已完成与待处理维度。采用 fail-closed
        语义：任一维度或任一天计数查询失败时整体返回错误，绝不以 0 顶替——否则看板与服务质量报告会得出完全错误的趋势结论。
      parameters:
      - default: 7
        description: 统计天数（默认 7）
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 逐日趋势数据
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.TicketTrendData'
                  type: array
              type: object
        "401":
          description: 未授权或租户上下文缺失
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: 趋势查询失败（含任一维度计数失败）
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 获取工单趋势
      tags:
      - Dashboard
