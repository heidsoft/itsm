    get:
      description: 三个云列表里唯一真分页的一个：total 来自仓储 Count，items 是当前页，page/pageSize/totalPages
        回显生效值（缺省 1/20，pageSize 越界回落 20）。provider 走云账号边而不是资源自报表字段。
      parameters:
      - description: 云厂商过滤
        enum:
        - aliyun
        - tencent
        - huawei
        - aws
        - azure
        - onprem
        in: query
        name: provider
        type: string
      - description: 云账号ID过滤
        in: query
        name: cloudAccountId
        type: integer
      - description: 云服务类型ID过滤
        in: query
        name: serviceId
        type: integer
      - description: Region 过滤
        in: query
        name: region
        type: string
      - description: 资源状态过滤
        in: query
        name: status
        type: string
      - description: 搜索关键词（云资源唯一ID前缀）
        in: query
        name: search
        type: string
      - description: 页码，缺省 1
        in: query
        name: page
        type: integer
      - description: 页长，缺省 20，最大 100；越界回落 20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CloudResourceListResponse'
              type: object
        "400":
          description: provider 枚举外 / 查询参数类型非法（含旧的 snake_case service_id）
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 租户上下文缺失
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - BearerAuth: []
      summary: 云资源分页列表
      tags:
      - CMDB-云资源
    post:
      consumes:
      - application/json
      description: cloudAccountId 与 serviceId 会先按当前租户重新加载：查不到即 404（跨租户与不存在同义，不回露差异）；两者厂商不一致是
        400。identity 字段与 firstSeenAt/lastSeenAt 由 service 派生，请求体无法自报 tenantId。
      parameters:
      - description: 云资源
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCloudResourceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CloudResourceResponse'
              type: object
        "400":
          description: 必填缺失 / 云账号与云服务厂商不一致
          schema:
            $ref: '#/definitions/common.Response'
        "401":
          description: 租户上下文缺失
          schema:
            $ref: '#/definitions/common.Response'
        "403":
          description: 缺少 cmdb write 权限
          schema:
            $ref: '#/definitions/common.Response'
        "404":
          description: 引用的云账号或云服务不存在/不属于当前租户
