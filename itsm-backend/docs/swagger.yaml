info:
  contact: {}
  description: AI-Native ITSM 平台 API：ITIL v4 核心流程（工单/事件/问题/变更/发布/服务请求）、CMDB、BPMN 工作流、知识库
    RAG、SLA、RBAC 与多租户隔离。
  title: ITSM API
  version: 1.6.9
paths:
  /api/dashboard:
    get:
      description: 获取仪表盘KPI指标、资源分布和健康状态数据
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardResponse'
              type: object
        "500":
