        in: query
        name: cloudAccountId
        type: string
      - description: 云区域
        in: query
        name: cloudRegion
        type: string
      - description: 负责人（模糊匹配）
        in: query
        name: assignedTo
        type: string
      - description: 拥有者（模糊匹配）
        in: query
        name: ownedBy
        type: string
