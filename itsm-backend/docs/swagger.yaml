  dto.GovernanceQuality:
    properties:
      active:
        type: integer
      assessable:
        description: |-
          Assessable 是「该 CI 类型存在必填属性定义」的 CI 数，即完整率的有效分母。
          全新租户没有属性定义时 Assessable=0：此时 CompletenessPct 恒为 0 而不是 100，
          否则「一条必填都没配」会被报成「数据完美」。
        type: integer
      attributeDefinedTypes:
        description: |-
          AttributeDefinedTypes 是本次评估中用到的「有必填属性定义」的 CI 类型数，
          便于调用方区分「完整率低」与「根本没配属性定义」。
        type: integer
      completenessPct:
        description: CompletenessPct 的属性级完整率，只在 Assessable 内有意义。
        type: number
      incomplete:
        description: |-
          Incomplete 是「必填属性未齐」的 CI 数，判据来自该 CI 类型的属性定义
          （CIAttributeValidator.RequiredAttributes），不按固定字段清单硬编码。
          没有任何必填属性定义的类型不产生 incomplete——那不是「都填齐了」。
        type: integer
      missingByAttribute:
        description: |-
          MissingByAttribute 汇总最缺的必填属性，按缺失次数降序。
          完整率只说明「有多不齐」，这个列表说明「该补哪个字段」。
        items:
          $ref: '#/definitions/dto.GovernanceMissingAttribute'
        type: array
      orphan:
        type: integer
      retired:
        type: integer
      stale:
        type: integer
      total:
        type: integer
    type: object
