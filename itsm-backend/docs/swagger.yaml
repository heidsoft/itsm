  /api/v1/cmdb/cis:
    get:
      consumes:
      - application/json
      description: 单一入口：覆盖原 List + Search 双接口。支持分页、过滤、关键词宽模糊、排序、标签过滤、时间范围与关系预加载。
      parameters:
      - description: 页码（默认1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认20，最大100；越界回落默认页长）
        in: query
        name: pageSize
        type: integer
      - description: CI类型ID（精确匹配）
        in: query
        name: ciTypeId
        type: integer
      - description: CI类型字符串（精确匹配）
        in: query
        name: ciType
        type: string
      - description: 状态（模糊匹配）
        in: query
        name: status
        type: string
      - description: 环境
        in: query
        name: environment
        type: string
      - description: 重要性
        in: query
        name: criticality
        type: string
      - description: 云厂商
        in: query
        name: cloudProvider
        type: string
      - description: 云账号ID
        in: query
        name: cloudAccountId
        type: string
      - description: 云区域
        in: query
        name: cloudRegion
        type: string
      - description: 负责人（模糊匹配）
        in: query
        name: assignedTo
        type: string
      - description: 拥有者（模糊匹配）
        in: query
        name: ownedBy
        type: string
      - description: 关键词宽模糊（名称/资产标签/序列号/型号/厂商/云资源ID/位置/负责人/归属人）
        in: query
        name: search
        type: string
      - description: CI唯一业务编号精确匹配（AI Agent 稳定定位实体用自然键）
        in: query
        name: ciNumber
        type: string
      - description: 排序字段（id/name/status/environment/criticality/created_at/updated_at）
        in: query
        name: sortBy
        type: string
      - description: 排序方向（asc/desc）
        in: query
        name: sortOrder
        type: string
      - description: 创建时间起始（RFC3339）
        in: query
        name: dateFrom
        type: string
      - description: 创建时间截止（RFC3339）
        in: query
        name: dateTo
        type: string
      - collectionFormat: csv
        description: 标签ID列表（OR）
        in: query
        items:
          type: integer
        name: tagIds
        type: array
      - description: 是否预加载关系（默认false）
        in: query
        name: withRelations
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CIListResponse'
              type: object
      summary: 获取配置项列表
      tags:
      - CMDB
    post:
      consumes:
      - application/json
      description: 创建新的配置项
      parameters:
      - description: 创建配置项请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CIResponse'
              type: object
      summary: 创建配置项
      tags:
      - CMDB
