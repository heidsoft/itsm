# ITSM Alertmanager Configuration
# Routes Prometheus alerts to notification channels.
#
# All alerts are forwarded to the alert-webhook bridge service, which creates
# alert records in the ITSM backend. For Feishu/DingTalk/WeCom notifications,
# paste the incoming webhook URL directly into the critical-all receiver below
# (Alertmanager does not support environment variable interpolation).

global:
  resolve_timeout: 5m
  # SMTP is optional; only used if email_configs are enabled below.
  # smtp_smarthost: '${SMTP_SMARTHOST}'
  # smtp_from: '${SMTP_FROM}'
  # smtp_auth_username: '${SMTP_AUTH_USERNAME}'
  # smtp_auth_password: '${SMTP_AUTH_PASSWORD}'

route:
  receiver: 'itsm-webhook'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  resolve_timeout: 5m

  routes:
    - match:
        severity: critical
      receiver: 'critical-all'
      group_wait: 10s
      continue: true

    - match:
        severity: warning
      receiver: 'itsm-webhook'

    - match:
        alertname: 'TargetDown'
      receiver: 'itsm-webhook'

receivers:
  # Primary receiver: forward all alerts to ITSM backend via alert-webhook bridge.
  # The alert-webhook service converts Alertmanager payloads into ITSM alert records.
  - name: 'itsm-webhook'
    webhook_configs:
      - url: 'http://alert-webhook:9094/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

  # Critical alerts: ITSM webhook + optional Feishu/DingTalk/WeCom webhooks.
  # Uncomment the webhook_configs block and paste the URL to enable a channel.
  - name: 'critical-all'
    webhook_configs:
      - url: 'http://alert-webhook:9094/webhook'
        send_resolved: true
    # Feishu (Lark) incoming webhook — paste the URL to enable.
    # webhook_configs:
    #   - url: 'https://open.feishu.cn/open-apis/bot/v2/hook/YOUR_TOKEN'
    #     send_resolved: true
    #     http_config:
    #       follow_redirects: true
    # DingTalk incoming webhook — paste the URL to enable.
    # webhook_configs:
    #   - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'
    #     send_resolved: true
    #     http_config:
    #       follow_redirects: true
    # WeCom (企业微信) incoming webhook — paste the URL to enable.
    # webhook_configs:
    #   - url: 'https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY'
    #     send_resolved: true
    #     http_config:
    #       follow_redirects: true

# Inhibit rules prevent alert storms when a root cause triggers many symptoms.
inhibit_rules:
  # Critical suppresses warning for the same alertname+service.
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'service']
