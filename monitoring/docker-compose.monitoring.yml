# DEPRECATED: Monitoring Stack Moved to Main Compose File
#
# The monitoring stack (Prometheus, Alertmanager, Grafana, exporters) has been
# merged into the main docker-compose.prod.yml file under the "monitoring" profile.
#
# This file is kept for reference only and is no longer used.
#
# To start the monitoring stack, use:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile monitoring up -d
#
# Prerequisites:
# 1. Set METRICS_REQUIRE_AUTH=false in .env.prod (allows Prometheus to scrape /metrics)
# 2. Set GRAFANA_ADMIN_PASSWORD to a strong password in .env.prod
#
# Monitoring ports (all localhost-only):
#   - Prometheus:   127.0.0.1:9090
#   - Alertmanager: 127.0.0.1:9093
#   - Grafana:      127.0.0.1:3001
#
# The configuration files in this directory are still used:
#   - prometheus.yml              -> Prometheus scrape config
#   - prometheus/alerts.yml       -> Prometheus alert rules
#   - alertmanager/alertmanager.yml -> Alertmanager routing config
#   - grafana/provisioning/       -> Grafana datasource + dashboard provisioning
#   - grafana/dashboards/         -> Pre-configured Grafana dashboards
